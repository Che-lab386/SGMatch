backend: dp
type: SGMatch_Model
num_gpu: auto
manual_seed: 1234
heat_diffusion_tau: 1.0e-4
non-isometric: false
partial: false
use_complex_fmap: true
n_conn: 20
n_lb: 140
n_elas: 60

path:
  resume_state: checkpoints/sgmatch_complex_q_1187.pth

datasets:
  train_dataset:
    name: SmalTrain
    type: PairSmalDataset
    phase: train
    data_root: data/SMAL_r
    category: true
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: false
    return_dist: false
    return_elas_evecs: true
    bending_weight: 0.01
    return_dino: true
    return_complex: true
    complex_cache_dir: data/SMAL_r/complex
    n_conn: 20
  test_dataset:
    name: SmalVal
    type: PairSmalDataset
    phase: test
    data_root: data/SMAL_r
    category: true
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: true
    return_dist: true
    return_elas_evecs: true
    bending_weight: 0.01
    return_dino: true
    return_complex: true
    complex_cache_dir: data/SMAL_r/complex
    n_conn: 20
  batch_size: 1
  num_worker: 0

networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 3
    out_channels: 256
    cache_dir: data/SMAL_r/diffusion
    input_type: xyz
  fmap_net:
    type: RegularizedFMNet
    bidirectional: true
  expanded_fmap_net:
    type: ExpandedResolventFMNet
    lmbda: 50
    bidirectional: true
  permutation:
    type: Similarity
    tau: 0.07
  flow_field:
    type: FlowField
    in_channels: 256
    hidden_dim: 512
    depth: 4
  cross_attention:
    type: CrossAttentionFusion
    geo_dim: 256
    sem_dim: 768
    attn_dim: 256
    num_heads: 8

train:
  total_epochs: 20
  weight_schedule: 2000
  w_q_orth: 1.0
  w_pq: 0.0
  w_contr: 0.0
  contrastive_scale: 6.0
  optims:
    feature_extractor:
      type: Adam
      lr: 1.0e-3
    flow_field:
      type: Adam
      lr: 1.0e-3
    cross_attention:
      type: Adam
      lr: 1.0e-3
  schedulers:
    feature_extractor:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 20
    flow_field:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 20
    cross_attention:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 20
  losses:
    surfmnet_loss:
      type: SURFMNetLoss
      w_bij: 1.0
      w_orth: 1.0
      w_lap: 0.0
    hs_surfmnet_loss:
      type: HS_SURFMNetLoss
      w_bij: 1.0
      w_orth: 0.0
      w_lap: 0.0
    align_loss:
      type: SquaredFrobeniusLoss
      loss_weight: 1.0
    hs_align_loss:
      type: SquaredHilbertSchmidtLoss
      loss_weight: 1.0
    flow_matching_loss:
      type: FlowMatchingLoss
      loss_weight: 100.0
      sample_ratio: 0.5
      alpha: 2.0

val:
  val_freq: 2000
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck

logger:
  print_freq: 20
  save_checkpoint_freq: 2000

