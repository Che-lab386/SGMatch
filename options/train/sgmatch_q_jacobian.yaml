# SGMatch + Q branch + Jacobian constraints (SMAL_r)
# Stage-1 verification of C isometric constraints:
#   - LB C: Laplacian commutativity turned on (surfmnet_loss.w_lap: 1.0e-2), as in SURFMNet.
#   - elastic C: loss left untouched (bijectivity + HS alignment only). The expanded-resolvent
#     branch is never orthogonality-constrained in prior work, so hs_surfmnet_loss.w_orth: 0.0.
#   - Q branch OFF (w_q_orth: 0.0); turn on only after l_orth converges.

backend: dp
type: SGMatch_Model
num_gpu: auto
manual_seed: 1234
heat_diffusion_tau: 1.0e-4
non-isometric: false
partial: false
n_lb: 140
n_elas: 60

# Q branch (top-level, read by SGMatch_Model.__init__)
use_complex_fmap: false
n_conn: 30
complex_cache_dir: data/SMAL_r/complex
w_q_orth: 0.0                # Stage-1: 0.0 (Q off). Stage-2: 0.1 after C is near-isometric
w_pq: 0.0                    # Pi-Q alignment (keep 0 for Scheme B)
q_verbose: false

# Jacobian constraint (top-level, read by SGMatch_Model.__init__)
# Stage-1 keeps them OFF so that orth/lap effects are measured in isolation.
use_jacobian_loss: false
w_jacobian_det: 0.01         # det(J) > 0 (orientation preserving)
w_jacobian_distortion: 0.01  # sigma_1 / sigma_2 <= jacobian_k_max (distortion bound)
jacobian_k_max: 3.0

path:
  resume_state:

# datasets
datasets:
  train_dataset:
    name: SmalTrain
    type: PairSmalDataset
    phase: train
    data_root: data/SMAL_r
    category: true
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: false
    return_dist: false
    return_elas_evecs: true
    bending_weight: 0.01
    return_dino: true
  test_dataset:
    name: SmalVal
    type: PairSmalDataset
    phase: test
    data_root: data/SMAL_r
    category: true
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: true
    return_dist: true
    return_elas_evecs: true
    bending_weight: 0.01
    return_dino: true
  batch_size: 1
  num_worker: 16

# network setting
networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 3
    out_channels: 256
    cache_dir: data/SMAL_r/diffusion
    input_type: xyz
  fmap_net:
    type: RegularizedFMNet
    bidirectional: true
  expanded_fmap_net:
    type: ExpandedResolventFMNet
    lmbda: 50
    bidirectional: true
  permutation:
    type: Similarity
    tau: 0.07
  flow_field:
    type: FlowField
    in_channels: 256
    hidden_dim: 512
    depth: 4
  cross_attention:
    type: CrossAttentionFusion
    geo_dim: 256
    sem_dim: 768
    attn_dim: 256
    num_heads: 8

# training setting
train:
  total_epochs: 20
  weight_schedule: 2000
  optims:
    feature_extractor:
      type: Adam
      lr: 1.0e-3
    flow_field:
      type: Adam
      lr: 1.0e-3
    cross_attention:
      type: Adam
      lr: 1.0e-3
  schedulers:
    feature_extractor:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 20
    flow_field:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 20
    cross_attention:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 20
  losses:
    surfmnet_loss:
      type: SURFMNetLoss
      w_bij: 1.0
      w_orth: 1.0
      w_lap: 1.0e-2           # NEW: Laplacian commutativity (structural / isometry prior)
    hs_surfmnet_loss:
      type: HS_SURFMNetLoss
      w_bij: 1.0
      w_orth: 0.0             # keep 0: elastic/expanded-resolvent C is not constrained to be orthogonal
      w_lap: 0.0              # unused by HS_SURFMNetLoss
    align_loss:
      type: SquaredFrobeniusLoss
      loss_weight: 1.0
    hs_align_loss:
      type: SquaredHilbertSchmidtLoss
      loss_weight: 1.0
    flow_matching_loss:
      type: FlowMatchingLoss
      loss_weight: 100.0
      sample_ratio: 0.5
      alpha: 2.0

val:
  val_freq: 2000
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck

# log setting
logger:
  print_freq: 20
  save_checkpoint_freq: 2000
